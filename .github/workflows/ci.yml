name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build FIRST: vite generates src/routeTree.gen.ts (gitignored) and
      # dist/server/server.js, both of which tsc needs to resolve the route
      # types and serve.ts/vercel-entry.ts imports. Without this ordering a
      # clean checkout type-checks against a route tree that doesn't exist yet.
      - name: Build
        run: bun run build

      - name: Chat privacy and account access regression tests
        run: bun test tests/chat-idempotency.test.ts tests/runtime.test.ts tests/closed-test.test.ts tests/native-db.test.ts

      # Bun types are included; every TypeScript error now fails CI.
      - name: Type-check
        run: node_modules/.bin/tsc --noEmit --pretty false

  flutter:
    name: Flutter — scaffold + analyze + build apk
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      # android/ and ios/ are intentionally not committed. Generate them in a
      # throwaway directory and copy ONLY the platform scaffolding (+ .metadata)
      # back, so the hand-written lib/, pubspec.yaml, and analysis_options.yaml
      # are never touched by `flutter create`.
      - name: Generate platform folders (never clobber authored source)
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d)
          cp -a lib "$snapshot/lib"
          cp -a pubspec.yaml analysis_options.yaml README.md .gitignore "$snapshot/"

          scaffold="$RUNNER_TEMP/beef_scaffold"
          rm -rf "$scaffold"
          flutter create "$scaffold" \
            --org com.beef \
            --project-name beef \
            --platforms android,ios \
            --no-pub

          cp -a "$scaffold/android" ./android
          cp -a "$scaffold/ios" ./ios
          [ -f "$scaffold/.metadata" ] && cp -a "$scaffold/.metadata" ./.metadata || true

          diff -rq "$snapshot/lib" lib
          diff -q "$snapshot/pubspec.yaml" pubspec.yaml
          diff -q "$snapshot/analysis_options.yaml" analysis_options.yaml
          diff -q "$snapshot/README.md" README.md
          diff -q "$snapshot/.gitignore" .gitignore
          echo "Authored files intact; platform folders generated."

      - name: Fetch dependencies
        run: flutter pub get

      - name: Configure generated foreground-only location permissions
        run: python3 scripts/configure_platforms.py

      - name: Generate BEEF launcher icons from approved master
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # An unconfigured APK contains no server URL, credentials or account data.
      # It opens only the setup screen; this is a build artifact, not deployment.
      - name: Retain unconfigured debug APK for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beef-unconfigured-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      # Explicit approved staging build, only on the existing review PR branch.
      # No request is made to the backend; this is offline compilation/inspection.
      - name: Test compiled closed-test configuration
        if: github.head_ref == 'review/private-controls-2026-10-26'
        run: >-
          flutter test test/closed_test_build_config_test.dart
          --dart-define=BEEF_EXPECT_CLOSED_TEST_BUILD=true
          --dart-define=BEEF_API_BASE_URL=https://beef-synthetic-staging.onrender.com
          --dart-define=BEEF_ENABLE_DEVICE_LOCATION=false

      - name: Build configured closed-test APK
        if: github.head_ref == 'review/private-controls-2026-10-26'
        run: >-
          flutter build apk --debug
          --dart-define=BEEF_API_BASE_URL=https://beef-synthetic-staging.onrender.com
          --dart-define=BEEF_ENABLE_DEVICE_LOCATION=false

      - name: Verify compiled APK configuration offline
        if: github.head_ref == 'review/private-controls-2026-10-26'
        run: python3 scripts/verify_closed_test_apk.py

      - name: Retain configured closed-test APK for one day
        if: github.head_ref == 'review/private-controls-2026-10-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beef-closed-synthetic-test-NOT-DEVICE-TESTED-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/closed-test-build-verification.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Build offline browser preview without deployment
        if: github.head_ref == 'review/private-controls-2026-10-26'
        run: |
          flutter create "$RUNNER_TEMP/beef_web_scaffold" --org com.beef --project-name beef --platforms web --no-pub
          cp -a "$RUNNER_TEMP/beef_web_scaffold/web" ./web
          flutter build web --target=lib/preview_main.dart --no-pub --no-web-resources-cdn

      - name: Retain synthetic offline web preview
        if: github.head_ref == 'review/private-controls-2026-10-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beef-offline-web-preview-NOT-NATIVE-IOS-${{ github.sha }}
          path: app/build/web/
          retention-days: 1
          if-no-files-found: error

      - name: Android emulator runtime with no backend network
        if: github.head_ref == 'review/private-controls-2026-10-26'
        run: bash scripts/android_runtime.sh

      - name: Retain Android runtime evidence
        if: always() && github.head_ref == 'review/private-controls-2026-10-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beef-android-runtime-evidence-${{ github.sha }}
          path: app/build/runtime-artifacts/
          retention-days: 1
          if-no-files-found: warn

